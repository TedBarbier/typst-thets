[package]
name = "thets"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["TedBarbier <https://github.com/TedBarbier>"]
license = "MIT-0"
description = "Unofficial port of the ÉTS (École de technologie supérieure) thETS thesis, master's thesis and project report template."
repository = "https://gitlab.com/TedBarbier/typst-thets"
keywords = ["ets", "etsmtl", "thesis", "memoire", "these", "rapport", "montreal"]
categories = ["thesis", "report"]
disciplines = ["engineering", "computer-science"]
compiler = "0.15.0"
exclude = [".gitlab-ci.yml", ".pkg", ".typst-cache", "out"]

[template]
path = "template"
entrypoint = "rapport.typ"
thumbnail = "thumbnail.png"
