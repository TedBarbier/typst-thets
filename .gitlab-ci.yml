# CI du paquet Typst `boreal-thesis-ets`.
# - format  : le code Typst respecte typstyle
# - compile : les deux modèles compilent avec la version minimale et la dernière version de Typst
# - tests   : tests tytanic (API, rendu de référence, modèle de `typst init`)
# - package : vérifications officielles de Typst Universe (typst/package-check)
# - version : sur un tag vX.Y.Z, la version de typst.toml et des imports correspond

stages: [check, release]

variables:
  TYPST_VERSION: "0.15.1"
  TYPSTYLE_VERSION: "v0.15.3"
  TYTANIC_VERSION: "v0.4.1"

format:
  stage: check
  image: alpine:3.22
  script:
    - apk add --no-cache curl
    - curl -fsSL -o /usr/local/bin/typstyle "https://github.com/typstyle-rs/typstyle/releases/download/${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-musl"
    - chmod +x /usr/local/bin/typstyle
    - typstyle --check src template tests

.compile:
  stage: check
  image:
    name: ghcr.io/typst/typst:${IMAGE_TAG}
    entrypoint: [""]
  variables:
    TYPST_PACKAGE_CACHE_PATH: "$CI_PROJECT_DIR/.typst-cache"
  script:
    # Rend le dépôt disponible sous @preview/boreal-thesis-ets:<version> sans passer par Universe.
    - VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' typst.toml)
    - mkdir -p "/tmp/pkg/preview/boreal-thesis-ets/$VERSION"
    - cp -r src template ets.csl Figures typst.toml "/tmp/pkg/preview/boreal-thesis-ets/$VERSION/"
    - mkdir -p out
    - cd template
    - typst compile --package-path /tmp/pkg rapport.typ ../out/rapport.pdf
    - typst compile --package-path /tmp/pkg rapport-english.typ ../out/rapport-english.pdf
  artifacts:
    paths: [out/, .typst-cache/]
    expire_in: 1 week

compile:
  extends: .compile
  variables:
    IMAGE_TAG: "${TYPST_VERSION}"
    TYPST_PACKAGE_CACHE_PATH: "$CI_PROJECT_DIR/.typst-cache"

compile-min:
  extends: .compile
  variables:
    IMAGE_TAG: "0.15.0" # version minimale déclarée dans typst.toml (compiler)
    TYPST_PACKAGE_CACHE_PATH: "$CI_PROJECT_DIR/.typst-cache"
  artifacts: null

tests:
  stage: check
  image: alpine:3.22
  script:
    - apk add --no-cache curl xz
    - curl -fsSL "https://github.com/typst-community/tytanic/releases/download/${TYTANIC_VERSION}/tytanic-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
    - install "$(find /tmp -type f -name tt | head -1)" /usr/local/bin/tt
    # Polices embarquées seulement (défaut) : rendu identique en local et en CI.
    - tt run --no-fail-fast --warnings ignore
  artifacts:
    when: on_failure
    paths: [tests/**/out/, tests/**/diff/]
    expire_in: 1 week

package:
  stage: check
  needs: [compile]
  image:
    name: ghcr.io/typst/package-check:0.7.0
    entrypoint: [""]
  script:
    # package-check ne télécharge rien : on lui fournit datify depuis le cache du job compile.
    - mkdir -p /.cache/typst
    - mv .typst-cache /.cache/typst/packages
    # Vérifie le paquet tel qu'il sera publié : sans .git, artefacts ni tests.
    - rm -rf out .git tests
    - typst-package-check check

version:
  stage: release
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' typst.toml)
    - test "v$VERSION" = "$CI_COMMIT_TAG" || { echo "typst.toml ($VERSION) != tag ($CI_COMMIT_TAG)"; exit 1; }
    - "! grep -rn '@preview/boreal-thesis-ets:' template README.md GUIDE.md | grep -v \"boreal-thesis-ets:$VERSION\""
